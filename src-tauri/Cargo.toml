[package]
name = "hypernix-gui"
version = "0.1.0"
description = "HyperNix Control: a desktop control center for hypernix-pip"
authors = ["Hyprnyx (hypernix-ai)"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hypernix_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
libc = "0.2"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
